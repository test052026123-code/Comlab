services:
  - type: web
    name: comlab-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: CONTROLLER_TRANSPORT
        value: cloud
      - key: CONTROLLER_ID
        value: LAB-CONTROLLER
      - key: CONTROLLER_DEVICE_KEY_SHA256
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: FIREBASE_DATABASE_URL
        value: https://comlab-45f0c-default-rtdb.asia-southeast1.firebasedatabase.app
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json
